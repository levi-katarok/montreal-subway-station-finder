<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montreal Transit Explorer | Multi-Modal Journey Planner</title>
    <meta name="description" content="Advanced multi-modal journey planner for Montreal's transit system with weather integration">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Line badges */
        .line-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.75rem;
            margin-right: 4px;
            border: 2px solid rgba(0, 0, 0, 0.1);
        }

        .line-green { background-color: #009B3A; color: white; }
        .line-orange { background-color: #FF6D00; color: white; }
        .line-yellow { background-color: #FEE100; color: #000; }
        .line-blue { background-color: #009DDC; color: white; }
        .line-rem { background-color: #0072CE; color: white; }

        /* Station cards */
        .station-card {
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
        }

        .station-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .station-card.selected {
            border-left-color: #009B3A;
            background-color: #f0fdf4;
        }

        /* Toggle buttons */
        .toggle-button {
            transition: all 0.2s ease;
        }

        .toggle-button:hover {
            transform: scale(1.05);
        }

        .toggle-button.active {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in { animation: fadeIn 0.3s ease; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Loading spinner */
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #009B3A;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Journey segment cards */
        .journey-segment {
            position: relative;
            padding-left: 2.5rem;
        }

        .journey-segment::before {
            content: '';
            position: absolute;
            left: 0.875rem;
            top: 2rem;
            bottom: -1rem;
            width: 2px;
            background-color: #e5e7eb;
        }

        .journey-segment:last-child::before {
            display: none;
        }

        .segment-icon {
            position: absolute;
            left: 0;
            top: 0.5rem;
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background-color: white;
            border: 2px solid #009B3A;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            z-index: 1;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="text-center sm:text-left">
                    <h1 class="text-3xl sm:text-4xl font-bold text-slate-800 flex items-center justify-center sm:justify-start gap-3">
                        <i class="fas fa-route text-blue-600"></i>
                        <span id="header-title">Montreal Transit Explorer</span>
                    </h1>
                    <p class="text-slate-600 mt-2" id="header-subtitle">
                        Multi-modal journey planner with weather integration
                    </p>
                </div>

                <!-- Language Toggle -->
                <div class="flex items-center gap-3">
                    <button id="lang-toggle"
                        class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all shadow-md hover:shadow-lg font-semibold">
                        <i class="fas fa-language"></i>
                        <span id="lang-text">FR</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Weather Widget -->
        <div id="weather-widget" class="bg-white rounded-2xl shadow-lg p-6 mb-6 hidden">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="text-5xl" id="weather-icon">🌤️</div>
                    <div>
                        <h3 class="text-lg font-semibold text-slate-800" id="weather-title">Current Weather</h3>
                        <p class="text-3xl font-bold text-slate-900" id="weather-temp">--°C</p>
                        <p class="text-sm text-slate-600" id="weather-condition">Loading...</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-sm text-slate-600 mb-2" id="weather-recommendation">--</p>
                </div>
            </div>
        </div>

        <!-- Search Section -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
            <div class="flex flex-col gap-4">
                <!-- Search Input -->
                <div class="relative">
                    <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="autocomplete"
                        class="w-full pl-12 pr-4 py-4 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-200 transition-all text-lg"
                        placeholder="Enter your location or address...">
                </div>

                <!-- Filters Row -->
                <div class="flex flex-wrap gap-3 items-center">
                    <!-- Accessibility Filter -->
                    <label class="flex items-center gap-2 px-4 py-2 bg-slate-100 rounded-lg cursor-pointer hover:bg-slate-200 transition-all">
                        <input type="checkbox" id="accessibility-filter" class="w-5 h-5 rounded accent-blue-600">
                        <i class="fas fa-wheelchair text-blue-600"></i>
                        <span id="accessibility-label" class="font-medium text-slate-700">Accessible Only</span>
                    </label>

                    <!-- Indoor Preference -->
                    <label class="flex items-center gap-2 px-4 py-2 bg-slate-100 rounded-lg cursor-pointer hover:bg-slate-200 transition-all">
                        <input type="checkbox" id="indoor-filter" class="w-5 h-5 rounded accent-blue-600">
                        <i class="fas fa-building text-blue-600"></i>
                        <span id="indoor-label" class="font-medium text-slate-700">Prefer Indoor</span>
                    </label>

                    <!-- Driving Option -->
                    <label class="flex items-center gap-2 px-4 py-2 bg-slate-100 rounded-lg cursor-pointer hover:bg-slate-200 transition-all">
                        <input type="checkbox" id="driving-filter" class="w-5 h-5 rounded accent-blue-600">
                        <i class="fas fa-car text-blue-600"></i>
                        <span id="driving-label" class="font-medium text-slate-700">Include Driving</span>
                    </label>

                    <!-- Favorites Button -->
                    <button id="favorites-btn"
                        class="flex items-center gap-2 px-4 py-2 bg-yellow-100 text-yellow-800 rounded-lg hover:bg-yellow-200 transition-all font-medium ml-auto">
                        <i class="fas fa-star"></i>
                        <span id="favorites-label">Favorites</span>
                        <span id="favorites-count" class="bg-yellow-300 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
                    </button>
                </div>

                <!-- Metro Line Toggles -->
                <div class="border-t pt-4">
                    <p class="text-sm font-semibold text-slate-600 mb-3" id="toggle-lines-label">Toggle Metro Lines:</p>
                    <div id="buttonsContainer" class="flex flex-wrap gap-2"></div>
                </div>
            </div>
        </div>

        <!-- Map -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden mb-6">
            <div id="map" class="w-full h-96 sm:h-[500px]"></div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="hidden flex justify-center items-center py-12">
            <div class="spinner"></div>
            <p class="ml-4 text-slate-600">Finding best routes...</p>
        </div>

        <!-- Results -->
        <div id="results" class="grid grid-cols-1 gap-6">
            <!-- Results will be injected here by TypeScript -->
        </div>

        <!-- Favorites Modal -->
        <div id="favorites-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[80vh] overflow-hidden">
                <div class="p-6 border-b flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fas fa-star text-yellow-500"></i>
                        <span id="favorites-modal-title">My Favorite Locations</span>
                    </h2>
                    <button id="close-favorites" class="text-slate-400 hover:text-slate-600 text-2xl">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="p-6 overflow-y-auto max-h-[60vh]">
                    <div id="favorites-list" class="space-y-3"></div>
                    <div id="no-favorites" class="text-center py-12 text-slate-400">
                        <i class="fas fa-star text-6xl mb-4 opacity-20"></i>
                        <p class="text-lg" id="no-favorites-text">No favorite locations saved yet</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- TypeScript Entry Point -->
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
